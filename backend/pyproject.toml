[project]
name = "aptly-pilot"
version = "0.1.0"
description = "A standalone FastAPI-based control plane for managing aptly mirrors, snapshots, publishes, jobs, and repository automation."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "sqlmodel>=0.0.22",
    "alembic>=1.13.2",
    "psycopg[binary]>=3.2.0",
    "requests>=2.32.5,<3.0.0",

    # Auth
    "PyJWT>=2.9.0",
    "pwdlib[argon2]>=0.2.1",
    "python-multipart>=0.0.9",
    "email-validator>=2.2.0",

    # Config
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]