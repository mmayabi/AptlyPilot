<section class="rounded-lg border border-slate-200 bg-white">
    <div class="border-b border-slate-100 px-5 py-4">
        <h2 class="text-base font-semibold text-slate-900">Change Password</h2>
    </div>

    <form
        class="grid gap-4 p-5"
        hx-post="/account/password"
        hx-target="#change-password-result"
        hx-swap="innerHTML">
        <label class="block">
            <span class="text-xs font-semibold uppercase text-slate-500">Current Password</span>
            <input
                type="password"
                name="current_password"
                autocomplete="current-password"
                required
                class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-800">
        </label>

        <label class="block">
            <span class="text-xs font-semibold uppercase text-slate-500">New Password</span>
            <input
                type="password"
                name="new_password"
                autocomplete="new-password"
                minlength="8"
                required
                class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-800">
        </label>

        <label class="block">
            <span class="text-xs font-semibold uppercase text-slate-500">Confirm New Password</span>
            <input
                type="password"
                name="confirm_password"
                autocomplete="new-password"
                minlength="8"
                required
                class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-800">
        </label>

        <div class="flex flex-wrap items-center justify-end gap-3">
            <div id="change-password-result" class="text-sm"></div>
            <button
                type="submit"
                class="inline-flex items-center rounded-md bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800">
                Change Password
            </button>
        </div>
    </form>
</section>
