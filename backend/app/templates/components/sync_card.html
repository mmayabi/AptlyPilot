<div
    id="sync-card"
    class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">

    <div class="flex justify-between items-start">

        <div>

            <h3 class="text-lg font-semibold">

                Aptly Synchronization

            </h3>

            <p class="text-sm text-slate-500 mt-1">

                Last synchronization

            </p>

            <p class="mt-3 text-xl font-semibold">

                {{ latest_aptly_sync_at }}

            </p>

        </div>

        <div>

            <button

                hx-post="/dashboard/sync"

                hx-target="#sync-card"

                hx-swap="outerHTML"

                class="rounded-lg bg-blue-600 hover:bg-blue-700 text-white px-5 py-2">

                Sync Now

            </button>

        </div>

    </div>

    {% if sync_running %}

    <div class="mt-5">

        <div class="w-full bg-slate-200 rounded-full h-2">

            <div
                class="bg-blue-600 h-2 rounded-full animate-pulse"
                style="width:100%;">
            </div>

        </div>

        <p class="text-xs text-slate-500 mt-2">

            Synchronization is running...

        </p>

    </div>

    {% endif %}

</div>
