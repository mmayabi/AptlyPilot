<header class="h-16 shrink-0 border-b bg-white flex items-center justify-between px-8">

    <div>

        {% include "components/breadcrumb.html" %}

    </div>

    <div class="flex items-center gap-5">

        <button class="text-slate-600 hover:text-blue-600">
            🔔
        </button>

        <button class="text-slate-600 hover:text-blue-600">
            🌙
        </button>

        <form
            action="/logout"
            method="post">
            <button
                type="submit"
                class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50"
                title="Sign out">
                Logout
            </button>
        </form>

        <a
            href="/account"
            class="{% if active_page=='account' %}text-blue-700{% else %}text-slate-700 hover:text-blue-600{% endif %} flex items-center gap-3">

            <div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-semibold">
                {{ current_user.username[0]|upper }}
            </div>

            <div>

                <div class="font-medium">

                    {{ current_user.username }}

                </div>

                <div class="text-xs text-slate-500">

                    Administrator

                </div>

            </div>

        </a>

    </div>

</header>
