<section
    id="users-panel"
    class="rounded-lg border border-slate-200 bg-white">
    <div class="border-b border-slate-100 px-5 py-4">
        <h2 class="text-base font-semibold text-slate-900">Users</h2>
    </div>

    <div class="grid gap-6 p-5 xl:grid-cols-[24rem_1fr]">
        <form
            class="grid gap-4"
            hx-post="/administration/users/create"
            hx-target="#users-panel"
            hx-swap="outerHTML">
            <label class="block">
                <span class="text-xs font-semibold uppercase text-slate-500">Username</span>
                <input
                    type="text"
                    name="username"
                    minlength="3"
                    required
                    autocomplete="off"
                    class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-800">
            </label>

            <label class="block">
                <span class="text-xs font-semibold uppercase text-slate-500">Password</span>
                <input
                    type="password"
                    name="password"
                    minlength="8"
                    required
                    autocomplete="new-password"
                    class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-800">
            </label>

            <label class="block">
                <span class="text-xs font-semibold uppercase text-slate-500">Email</span>
                <input
                    type="email"
                    name="email"
                    autocomplete="off"
                    class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-800">
            </label>

            <label class="block">
                <span class="text-xs font-semibold uppercase text-slate-500">Full Name</span>
                <input
                    type="text"
                    name="full_name"
                    autocomplete="off"
                    class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-800">
            </label>

            <label class="block">
                <span class="text-xs font-semibold uppercase text-slate-500">Role</span>
                <select
                    name="role"
                    class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-800">
                    {% for role in user_roles %}
                    <option value="{{ role }}" {% if role == "viewer" %}selected{% endif %}>{{ role|title }}</option>
                    {% endfor %}
                </select>
            </label>

            <label class="flex items-center gap-2 text-sm text-slate-700">
                <input
                    type="checkbox"
                    name="is_active"
                    value="true"
                    checked
                    class="rounded border-slate-300">
                Active
            </label>

            <div class="flex flex-wrap items-center justify-end gap-3">
                {% if message %}
                <div class="rounded-md border border-green-200 bg-green-50 px-3 py-2 text-sm font-medium text-green-700">
                    {{ message }}
                </div>
                {% endif %}

                {% if error %}
                <div class="rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm font-medium text-red-700">
                    {{ error }}
                </div>
                {% endif %}

                <button
                    type="submit"
                    class="inline-flex items-center rounded-md bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800">
                    Add User
                </button>
            </div>
        </form>

        <div class="overflow-hidden rounded-lg border border-slate-200">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-200 text-sm">
                    <thead class="bg-slate-50">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase text-slate-500">Username</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase text-slate-500">Email</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase text-slate-500">Role</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase text-slate-500">Status</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase text-slate-500">Password</th>
                            <th class="px-4 py-3 text-right text-xs font-semibold uppercase text-slate-500">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 bg-white">
                        {% for user in users %}
                        <tr>
                            <td class="px-4 py-3">
                                <div class="font-medium text-slate-900">{{ user.username }}</div>
                                {% if user.id == current_user.id %}
                                <div class="mt-1 text-xs text-slate-500">Current user</div>
                                {% endif %}
                            </td>
                            <td class="px-4 py-3 text-slate-600">{{ user.email or "-" }}</td>
                            <td class="px-4 py-3">
                                <form
                                    id="user-update-{{ user.id }}"
                                    class="flex min-w-64 items-center gap-2"
                                    hx-post="/administration/users/{{ user.id }}/update"
                                    hx-target="#users-panel"
                                    hx-swap="outerHTML">
                                    <select
                                        name="role"
                                        {% if user.id == current_user.id %}disabled{% endif %}
                                        class="rounded-md border border-slate-300 bg-white px-2 py-1.5 text-sm text-slate-800">
                                        {% for role in user_roles %}
                                        <option value="{{ role }}" {% if role == user.role %}selected{% endif %}>{{ role|title }}</option>
                                        {% endfor %}
                                    </select>
                                </form>
                            </td>
                            <td class="px-4 py-3">
                                <label
                                    form="user-update-{{ user.id }}"
                                    class="flex items-center gap-2 text-sm text-slate-700">
                                    <input
                                        form="user-update-{{ user.id }}"
                                        type="checkbox"
                                        name="is_active"
                                        value="true"
                                        {% if user.is_active %}checked{% endif %}
                                        {% if user.id == current_user.id %}disabled{% endif %}
                                        class="rounded border-slate-300">
                                    Active
                                </label>
                            </td>
                            <td class="px-4 py-3">
                                <form
                                    class="flex min-w-72 items-center gap-2"
                                    hx-post="/administration/users/{{ user.id }}/reset-password"
                                    hx-target="#users-panel"
                                    hx-swap="outerHTML">
                                    <input
                                        type="password"
                                        name="password"
                                        minlength="8"
                                        placeholder="New password"
                                        required
                                        {% if user.id == current_user.id %}disabled{% endif %}
                                        class="w-40 rounded-md border border-slate-300 bg-white px-2 py-1.5 text-sm text-slate-800">
                                    <button
                                        type="submit"
                                        {% if user.id == current_user.id %}disabled{% endif %}
                                        class="rounded-md border border-slate-300 px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-50">
                                        Reset
                                    </button>
                                </form>
                            </td>
                            <td class="px-4 py-3">
                                <div class="flex items-center justify-end gap-2">
                                    <button
                                        type="submit"
                                        form="user-update-{{ user.id }}"
                                        {% if user.id == current_user.id %}disabled{% endif %}
                                        class="rounded-md bg-slate-900 px-3 py-1.5 text-xs font-semibold text-white hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-50">
                                        Save
                                    </button>

                                    <form
                                        hx-post="/administration/users/{{ user.id }}/delete"
                                        hx-target="#users-panel"
                                        hx-swap="outerHTML"
                                        hx-confirm="Delete user '{{ user.username }}'?">
                                        <button
                                            type="submit"
                                            {% if user.id == current_user.id %}disabled{% endif %}
                                            class="rounded-md border border-red-200 px-3 py-1.5 text-xs font-semibold text-red-700 hover:bg-red-50 disabled:cursor-not-allowed disabled:opacity-50">
                                            Delete
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
