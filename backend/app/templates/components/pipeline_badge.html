{# templates/components/pipeline_badge.html #}

<div class="flex items-center gap-2">

    <span
        class="inline-flex h-6 w-6 items-center justify-center rounded-full text-xs font-semibold {% if mirror %}bg-green-100 text-green-700{% else %}bg-slate-100 text-slate-400{% endif %}"
        title="Mirror"
    >
        M
    </span>

    <span
        class="inline-flex h-6 w-6 items-center justify-center rounded-full text-xs font-semibold {% if snapshot %}bg-green-100 text-green-700{% else %}bg-slate-100 text-slate-400{% endif %}"
        title="Snapshot"
    >
        S
    </span>

    <span
        class="inline-flex h-6 w-6 items-center justify-center rounded-full text-xs font-semibold {% if publish %}bg-green-100 text-green-700{% else %}bg-slate-100 text-slate-400{% endif %}"
        title="Publish"
    >
        P
    </span>

</div>
