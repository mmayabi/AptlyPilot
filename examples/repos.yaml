defaults:
  mirror:
    enabled: true
    ignore_signatures: false
    max_tries: 3
  snapshot:
    enabled: true
    naming: '{name}-{timestamp}'
    timestamp_format: '%Y%m%d-%H%M'
  publish:
    enabled: true
    endpoint: filesystem:repo
    gpg_key: CHANGE_ME
    skip_signing: false
    acquire_by_hash: true
    skip_bz2: true
    skip_contents: true
  test:
    enabled: true
    checks: [metadata]
  retention:
    keep_last: 7
repos:
  debian:
    jessie:
      debian-08-jessie:
        mirror:
          archive_url: http://192.168.1.10/archive/debian
          distribution: jessie
          components: [main, contrib, non-free]
          architectures: [amd64]
          ignore_signatures: true
        publish:
          prefix: debian
          distribution: jessie
          components: [contrib, main, non-free]
          architectures: [amd64]
          label: Debian
          origin: Debian
          codename: jessie
          suite: unstable
