defaults:
  mirror:
    enabled: true
    ignore_signatures: false
    max_tries: 3
  snapshot:
    enabled: true
    naming: '{name}-{timestamp}'
    timestamp_format: '%Y%m%d-%H%M'
  publish:
    enabled: true
    endpoint: filesystem:repository
    gpg_key: XXXXXXXXXXXXXXXXXXX
    skip_signing: false
    acquire_by_hash: true
    skip_bz2: true
    skip_contents: true
  test:
    enabled: true
    checks: [metadata]
  retention:
    keep_last: 3
  schedule:
    enabled: true
    type: weekly
